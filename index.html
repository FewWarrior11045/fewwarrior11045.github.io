<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --case:#262A5C;      /* 게임기 몸체 */
  --case-dk:#181B3F;
  --lcd:#E3EDD2;       /* 화면 */
  --lcd-dk:#C9D8B2;
  --ink:#1E2A1B;       /* 글자·테두리 */
  --sub:#3B4735;
  --sel:#3182F6;       /* 선택 */
  --gold:#FFC342;
  --px:4px;
  --kr:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --title:"Do Hyeon", "Noto Sans KR", sans-serif;
  --num:"Press Start 2P", "Courier New", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --case:#2C3168; } }
:root[data-theme="dark"]{ --case:#262A5C; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--case); color:var(--ink); font-family:var(--kr); font-size:16px; line-height:1.5; font-weight:500;
  background-image:radial-gradient(rgba(0,0,0,.18) 1px, transparent 1px); background-size:8px 8px;
}
button{font:inherit; color:inherit; cursor:pointer}
.wrap{max-width:520px; margin:0 auto; padding:20px 18px 64px}
:focus-visible{outline:3px dashed var(--gold); outline-offset:4px}

/* 픽셀 테두리: 모서리가 계단처럼 깎인 상자 */
.px{
  background:var(--lcd);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink);
  margin:var(--px);
}

/* 상단 */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:22px}
.logo{font-family:var(--title); font-weight:400; color:var(--lcd); font-size:2.4rem; line-height:1; letter-spacing:.02em; margin:0; text-shadow:3px 3px 0 var(--case-dk)}
.logo small{display:block; font-family:var(--num); font-size:.6rem; color:var(--gold); letter-spacing:0; margin-bottom:10px; text-shadow:none}
.meter{border:0; background:transparent; color:var(--lcd); text-align:right; font-size:.95rem; font-weight:700; flex:none; padding:4px 0}
.meter .lbl{display:flex; align-items:center; justify-content:flex-end; gap:5px}
.meter b{font-family:var(--num); font-size:.8rem; font-weight:400; color:var(--gold)}
.meter .go{font-size:.7rem; color:var(--gold)}
.meter:hover .lbl,.meter:focus-visible .lbl{text-decoration:underline; text-underline-offset:4px}
.bar{display:grid; grid-template-columns:repeat(12,1fr); gap:1px; width:110px; margin:3px 0 0 auto}
.bar i{height:8px; background:var(--case-dk)}
.bar i.on{background:var(--gold)}

/* 검색 */
.search{display:flex; align-items:center; gap:10px; padding:4px 14px}
.search span{font-family:var(--num); font-size:.6rem; animation:blink 1s steps(1) infinite}
.search input{flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; color:var(--ink); padding:10px 0}
.search input::placeholder{color:var(--sub)}
@keyframes blink{50%{opacity:0}}

/* 타입 */
.types{display:flex; gap:10px; overflow-x:auto; padding:12px 6px 10px; margin:6px -6px 4px; scrollbar-width:none}
.types::-webkit-scrollbar{display:none}
.type{
  flex:none; border:0; padding:7px 14px; font-size:1rem; font-weight:700; color:var(--lcd); background:var(--case-dk);
  box-shadow:0 -3px 0 0 var(--case-dk),0 3px 0 0 var(--case-dk),-3px 0 0 0 var(--case-dk),3px 0 0 0 var(--case-dk); margin:3px;
}
.type[aria-pressed="true"]{background:var(--tc,var(--lcd)); color:var(--ink);
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}

/* 목록 */
.board{padding:16px 14px 8px; margin-top:12px}
.board-head{display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:var(--px) dotted var(--ink); padding-bottom:10px; margin-bottom:4px}
.board-head h2{margin:0; font-family:var(--title); font-size:1.4rem; font-weight:400}
.tool-btn{border:0; background:var(--ink); color:var(--lcd); padding:8px 12px; font-size:.9rem; font-weight:700}
.tool-btn:active{transform:translate(2px,2px)}
.list{list-style:none; margin:0; padding:0}
.entry{width:100%; display:grid; grid-template-columns:28px 44px 1fr auto; align-items:center; gap:12px; border:0; background:transparent; text-align:left; padding:12px 4px; border-bottom:2px dashed var(--lcd-dk)}
.list li:last-child .entry{border-bottom:0}
.entry:hover,.entry:focus-visible{background:var(--lcd-dk)}
.entry .rank{font-family:var(--num); font-size:.85rem; color:var(--sub); text-align:center}
.entry .rank.first{color:var(--sel)}
.sprite{display:block; image-rendering:pixelated}
.entry .nm{display:block; font-family:var(--title); font-size:1.3rem; line-height:1.2}

.entry .ds{display:block; font-size:.88rem; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.entry .meta{display:flex; align-items:center; gap:6px; min-width:0; margin-top:2px}
.chip{display:inline-block; flex:none; white-space:nowrap; font-size:.78rem; font-weight:700; padding:0 6px; background:var(--tc); color:var(--ink); line-height:1.5}
.seen{flex:none; font-size:.78rem; font-weight:700; color:#fff; background:var(--sel); padding:0 6px}
.score{font-family:var(--num); font-size:.95rem; text-align:right}
.empty{padding:28px 6px; text-align:center; color:var(--sub)}

/* 상세 */
.dtop{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.back{border:0; background:transparent; color:var(--lcd); font-size:1rem; font-weight:700; padding:6px 0}
.icons{display:flex; gap:10px}
.icon-btn{border:0; background:var(--lcd); color:var(--ink); font-size:.95rem; font-weight:700; padding:7px 12px; margin:3px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.icon-btn:active{transform:translate(2px,2px)}
.icon-btn.fav[aria-pressed="true"]{background:#F04452; color:#fff}
.heart{display:inline-block; vertical-align:middle; margin-left:6px}
.pxheart{display:inline-block; vertical-align:-2px; image-rendering:pixelated}
.icon-btn .pxheart,.type .pxheart{margin-right:5px}
/* 퀴즈 입구 */
.quest{display:flex; align-items:center; gap:12px; width:calc(100% - 8px); border:0; text-align:left; padding:12px 14px; margin:18px 4px 4px; background:var(--gold);
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.quest:active{transform:translate(2px,2px)}
.quest .em{font-size:1.7rem; line-height:1}
.quest b{display:block; font-family:var(--title); font-weight:400; font-size:1.3rem; line-height:1.2}
.quest span.s{display:block; font-size:.88rem; color:#4A3B12}
.quest .arrow{margin-left:auto; font-family:var(--num); font-size:.8rem}
/* 퀴즈 */
.qbox{padding:18px 16px 16px}
.qtop{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.qstep{font-family:var(--num); font-size:.75rem}
.qprog{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; flex:1; max-width:200px}
.qprog i{height:10px; background:var(--lcd-dk)}
.qprog i.on{background:var(--sel)}
.qtitle{margin:0 0 16px; font-family:var(--title); font-weight:400; font-size:1.7rem; line-height:1.25}
.qopts{display:grid; gap:10px}
.qopts.two{grid-template-columns:1fr 1fr}
.qopt{display:flex; align-items:center; gap:10px; border:0; background:#FAFDF4; padding:12px 12px 12px 26px; text-align:left; font-weight:700; position:relative; margin:3px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.qopt::before{content:"▶"; position:absolute; left:9px; font-size:.7rem; color:var(--sel); opacity:0}
.qopt:hover::before,.qopt:focus-visible::before{opacity:1}
.qopt:hover,.qopt:focus-visible{background:#fff}
.qopt .em{font-size:1.3rem; flex:none}
.qopt{word-break:keep-all}
.qopts.two .qopt{flex-direction:column; justify-content:center; gap:4px; padding:12px 8px; text-align:center; font-size:.95rem; line-height:1.3}
.qopts.two .qopt::before{left:7px; top:8px}
.qprev{border:0; background:transparent; color:var(--sub); font-weight:700; margin-top:14px; padding:6px 0}
.found{text-align:center; padding:0 0 14px}
.found .stage{margin-bottom:12px}
.found .hello{font-family:var(--num); font-size:.75rem; color:var(--ink); margin:0 0 6px}
.found h1{margin:0; font-family:var(--title); font-weight:400; font-size:2.2rem; line-height:1.1}
.found p{margin:4px 16px 0; color:var(--sub)}
.found-btns{display:grid; gap:12px; padding:4px 12px 4px}
.found-btns .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.act.plain{background:var(--lcd)}
.subboard{padding:14px 14px 6px; margin-top:16px}
.subboard h2{margin:0 0 4px; font-family:var(--title); font-weight:400; font-size:1.25rem}

/* 내 도감 */
.dexhead{padding:16px 16px 14px; margin-bottom:18px}
.dexhead h1{margin:0; font-family:var(--title); font-weight:400; font-size:1.9rem; line-height:1.1}
.dexhead .count{display:flex; align-items:baseline; justify-content:space-between; margin:8px 0 6px; color:var(--sub)}
.dexhead .count b{font-family:var(--num); font-weight:400; font-size:1rem; color:var(--ink)}
.bigbar{display:grid; grid-template-columns:repeat(47,1fr); gap:1px}
.bigbar i{height:10px; background:var(--lcd-dk)}
.bigbar i.on{background:var(--gold); box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.dexsec{margin:0 0 18px}
.dexsec h2{display:flex; align-items:center; gap:8px; margin:0 0 8px; color:var(--lcd); font-family:var(--title); font-weight:400; font-size:1.25rem}
.dexsec h2 .n{font-family:var(--num); font-size:.7rem; color:var(--gold)}
.dexsec h2 i{width:12px; height:12px; background:var(--tc); display:inline-block}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px}
.cell{border:0; background:var(--lcd); padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; margin:3px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.cell.locked{background:var(--lcd-dk)}
.cell .no{font-family:var(--num); font-size:.5rem; color:var(--sub)}
.cell .nm{font-size:.8rem; font-weight:700; line-height:1.25; text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cell.locked .nm{color:var(--sub)}
.cell:hover,.cell:focus-visible{background:#F6FAEE}
.card{padding:0; overflow:hidden}
.stage{position:relative; display:grid; place-items:center; padding:26px 0 18px; background:var(--tc);
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 4px)}
.stage .sprite{width:160px; height:160px}
.stage.pop .sprite{animation:pop .5s steps(4) both}
@keyframes pop{0%{transform:translateY(24px) scale(.6)} 60%{transform:translateY(-8px) scale(1.05)} 100%{transform:none}}
.stage .dexno{position:absolute; left:12px; top:12px; font-family:var(--num); font-size:.8rem}
.stage .rankbadge{position:absolute; right:12px; top:10px; font-size:.95rem; font-weight:700; background:var(--ink); color:var(--lcd); padding:2px 8px}
.id{padding:14px 16px 4px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.id h1{margin:0; font-family:var(--title); font-size:2.1rem; font-weight:400; line-height:1.1}
.id .desc{margin:4px 0 0; color:var(--sub); font-size:.95rem}
.id .big{font-family:var(--num); font-size:1.5rem; text-align:right; flex:none}
.id .big small{display:block; font-family:var(--kr); font-size:.8rem; color:var(--sub); margin-top:6px}
.stats{padding:12px 16px 4px; display:grid; gap:8px}
.stat{display:grid; grid-template-columns:7.2em 1fr 40px; white-space:nowrap; align-items:center; gap:10px; font-size:.95rem; font-weight:700}
.seg{display:grid; grid-template-columns:repeat(10,1fr); gap:3px}
.seg i{height:12px; background:var(--lcd-dk)}
.seg i.on{background:var(--ink)}
.stat b{font-family:var(--num); font-size:.75rem; font-weight:400; text-align:right}
.talk{margin:16px 12px 6px; padding:12px 14px; background:#FAFDF4; position:relative}
.talk h3{margin:0 0 4px; font-family:var(--title); font-size:1.15rem; font-weight:400; color:var(--sel)}
.talk ul{margin:0 0 10px; padding:0; list-style:none}
.talk li{padding-left:16px; position:relative}
.talk li::before{content:"▸"; position:absolute; left:0}
.talk p{margin:0 0 10px}
.talk .more{position:absolute; right:10px; bottom:6px; font-size:.7rem; animation:blink 1s steps(1) infinite}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 12px 16px}
.act{border:0; padding:12px 8px; font-size:1.05rem; font-weight:700; text-align:center; text-decoration:none; display:block;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink), 3px 6px 0 0 var(--ink); margin:3px}
.act:active{transform:translate(3px,3px); box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.act.collect{background:var(--lcd)}
.act.collect[aria-pressed="true"]{background:var(--gold)}
.act.go{background:var(--sel); color:#fff}

/* 기준 창 */
.modal-bg{position:fixed; inset:0; background:rgba(10,12,30,.6); display:none; z-index:20}
.modal{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(460px, calc(100% - 40px)); z-index:21; display:none; padding:18px 16px 16px}
.modal.open,.modal-bg.open{display:block}
.modal h2{margin:0 0 2px; font-family:var(--title); font-size:1.4rem; font-weight:400}
.modal p{margin:0 0 12px; color:var(--sub); font-size:.9rem}
.wrow{display:grid; grid-template-columns:1fr auto 44px auto; align-items:center; gap:10px; padding:6px 0}
.step{border:0; width:38px; height:38px; background:var(--ink); color:var(--lcd); font-family:var(--num); font-size:.9rem}
.step:disabled{opacity:.3; cursor:default}
.wrow{font-weight:700}
.wrow output{font-family:var(--num); font-size:.85rem; text-align:center}
.modal-foot{display:flex; justify-content:space-between; gap:10px; margin-top:12px}
.modal-foot .tool-btn{padding:10px 14px; font-size:.95rem}
.modal-foot .plain{background:transparent; color:var(--sub)}

.toast{position:fixed; white-space:nowrap; max-width:calc(100% - 40px); overflow:hidden; text-overflow:ellipsis; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--lcd); padding:10px 16px; font-size:.95rem; z-index:30; display:none}
.toast.show{display:block}
.foot{color:var(--lcd-dk); opacity:.85; text-align:center; font-size:.85rem; margin-top:26px}

@media (prefers-reduced-motion: reduce){
  .search span,.talk .more{animation:none}
  .stage.pop .sprite{animation:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 홈 -->
  <section id="home">
    <header class="top">
      <h1 class="logo"><small>NO.001~047</small>AI 도감</h1>
      <button class="meter" id="openDex" aria-label="내 도감 열기"><span class="lbl">써본 AI <b id="cnt">0/47</b><span class="go" aria-hidden="true">▶</span></span><span class="bar" id="bar" aria-hidden="true"></span></button>
    </header>

    <label class="search px"><span aria-hidden="true">▶</span>
      <input id="q" type="search" placeholder="AI 이름이나 하고 싶은 일 검색" autocomplete="off" aria-label="AI 검색">
    </label>

    <button class="quest" id="openQuiz"><span class="em" aria-hidden="true">🎯</span>
      <span><b>나에게 맞는 AI 찾기</b><span class="s">질문 4개에 답하면 딱 맞는 AI를 골라 줘요</span></span><span class="arrow" aria-hidden="true">▶</span></button>

    <div class="types" id="types" role="toolbar" aria-label="타입"></div>

    <div class="board px">
      <div class="board-head">
        <h2 id="title">챗봇 타입 순위</h2>
        <button class="tool-btn" id="openW">기준 바꾸기</button>
      </div>
      <ul class="list" id="list"></ul>
    </div>
    <p class="foot">점수와 후기는 직접 써본 경험을 바탕으로 합니다.</p>
  </section>

  <!-- 상세 -->
  <section id="detail" hidden></section>

  <!-- 내 도감 -->
  <section id="dex" hidden></section>

  <!-- 퀴즈 -->
  <section id="quiz" hidden></section>
</div>

<div class="modal-bg" id="mbg"></div>
<div class="modal px" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h2 id="mTitle">내 채점 기준</h2>
  <p>중요한 기준일수록 높이세요. 0이면 점수에서 빠져요.</p>
  <div id="wrows"></div>
  <div class="modal-foot">
    <button class="tool-btn plain" id="resetW">기본값으로</button>
    <button class="tool-btn" id="closeW">적용하기</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 채점 기준
const CRITERIA = [
  { key: "quality", label: "결과물 품질" },
  { key: "free",    label: "무료로 쓸 만함" },
  { key: "korean",  label: "한국어" },
  { key: "easy",    label: "쉬운 정도" },
];

// 카테고리
const CATEGORIES = [
  { id: "chat",  label: "챗봇" },
  { id: "image", label: "그림" },
  { id: "video", label: "영상" },
  { id: "audio", label: "오디오 편집" },
  { id: "music", label: "음악" },
  { id: "code",  label: "코딩" },
  { id: "slide", label: "발표자료" },
  { id: "study", label: "공부" },
  { id: "trans", label: "번역" },
];

/* AI 목록
   id      : 주소에 쓰이는 영어 이름 (예: 사이트주소/#/ai/chatgpt)
   s       : 점수 1~5 (0.5 단위 가능) — 지금은 전부 예시!
   pros    : 장점, cons: 단점, who: 이런 사람에게 추천
   review  : 직접 써본 후기 (줄바꿈은 \n). 비워두면 "후기 준비 중"으로 보여요
   updated : 마지막으로 확인한 날짜                                          */
const TOOLS = [
  { id:"chatgpt", cat:"chat", name:"ChatGPT", desc:"뭐든 물어보기 좋은 범용 챗봇", url:"https://chatgpt.com",
    s:{quality:4.5, free:4, korean:4.5, easy:5},
    pros:["질문, 글쓰기, 번역 등 거의 모든 용도에 쓸 수 있음","이미지 만들기도 같이 됨"], cons:["무료는 많이 쓰면 한도에 걸림"],
    who:"AI를 처음 써보는 사람", review:"", updated:"2026-10" },

  let s = 0, w = 0;
  for (const c of CRITERIA){ s += (t.s[c.key] || 0) * weights[c.key]; w += weights[c.key]; }
  return w ? s / w : 0;
}

/* 이름으로 정해지는 픽셀 캐릭터 (매번 같은 모양) */
function sprite(t, size, sil){
  let h = 2166136261;
  for (const ch of t.id) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const W = 8, H = 8, g = [];
  for (let y = 0; y < H; y++){
    g[y] = [];
    for (let x = 0; x < W / 2; x++){
      const core = y >= 2 && y <= 5 && x >= 2;
      const edge = (y === 0 || y === H - 1) ? .25 : x === 0 ? .3 : .6;
      g[y][x] = core || rnd() < edge ? 1 : 0;
    }
    for (let x = W / 2; x < W; x++) g[y][x] = g[y][W - 1 - x];
  }
  const [body, shade] = TYPE_COLORS[t.cat] || ["#ccc", "#888"];
  const cells = [];
  const filled = (x, y) => y >= 0 && y < H && x >= 0 && x < W && g[y][x];
  for (let y = -1; y <= H; y++) for (let x = -1; x <= W; x++){
    if (filled(x, y)) continue;
    if (filled(x+1,y) || filled(x-1,y) || filled(x,y+1) || filled(x,y-1)) cells.push(`<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="#1E2A1B"/>`);
  }
  const mouth = rnd() < .6;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    if (!g[y][x]) continue;
    let c = y >= 6 ? shade : body;
    if (y === 3 && (x === 2 || x === 5)) c = "#1E2A1B";
    if (y === 2 && (x === 2 || x === 5)) c = "#FFFFFF";
    if (mouth && y === 5 && (x === 3 || x === 4)) c = shade;
    if (sil) c = "#8C9A84";
    cells.push(`<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="${c}"/>`);
  }
  return `<svg class="sprite" width="${size}" height="${size}" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">${cells.join("")}</svg>`;
}

/* 픽셀 하트: filled면 꽉 찬 하트, 아니면 빈 하트 */
function heart(size, color, filled){
  const full = [".XX.XX.","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
  const line = [".XX.XX.","X..X..X","X.....X",".X...X.","..X.X..","...X..."];
  const rows = filled ? full : line, r = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "X") r.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`); }));
  return `<svg class="pxheart" width="${size}" height="${Math.round(size * 6 / 7)}" viewBox="0 0 7 6" fill="${color}" shape-rendering="crispEdges" aria-hidden="true">${r.join("")}</svg>`;
}

  qAns.forEach(a => { if (a.set.cat) cat = a.set.cat; Object.assign(w, a.set.w || {}); });
  const score = t => { let s = 0, sw = 0; for (const k in w){ s += (t.s[k] || 0) * w[k]; sw += w[k]; } return sw ? s / sw : 0; };
  return { list: TOOLS.filter(t => t.cat === cat).map(t => ({t, fit: score(t)})).sort((a, b) => b.fit - a.fit), w };
}
function renderQuiz(){
  const el = $("quiz");
  const top = `<div class="dtop"><button class="back" id="qBack">◀ 목록으로</button></div>`;
  if (qStep < QUIZ.length){
    const Q = QUIZ[qStep];
    el.innerHTML = `${top}<div class="qbox px">
      <div class="qtop"><span class="qstep">Q${qStep + 1}/${QUIZ.length}</span>
        <span class="qprog" aria-hidden="true">${QUIZ.map((_, i) => `<i class="${i <= qStep ? "on" : ""}"></i>`).join("")}</span></div>
      <h1 class="qtitle">${esc(Q.q)}</h1>
      <div class="qopts ${Q.grid ? "two" : ""}">${Q.opts.map((o, i) =>
        `<button class="qopt" data-i="${i}"><span class="em" aria-hidden="true">${o.em}</span>${esc(o.t)}</button>`).join("")}</div>
      ${qStep > 0 ? `<button class="qprev" id="qPrev">◀ 이전 질문</button>` : ""}
    </div>`;
    el.querySelectorAll(".qopt").forEach(b => b.onclick = () => { qAns[qStep] = Q.opts[+b.dataset.i]; qStep++; renderQuiz(); window.scrollTo(0, 0); });
    if ($("qPrev")) $("qPrev").onclick = () => { qStep--; renderQuiz(); };
    const first = el.querySelector(".qopt"); if (first) first.focus({ preventScroll:true });
  } else {
    const { list, w } = quizResult();
    const best = list[0] && list[0].t;
    if (!best){ el.innerHTML = `${top}<div class="qbox px"><p>이 분야에 아직 AI가 없어요.</p></div>`; }
    else {
      const reasons = Object.keys(w).filter(k => w[k] >= 1.5 && (best.s[k] || 0) >= 4).sort((a, b) => w[b] - w[a]).map(k => WHY[k]);
      if (!reasons.length) reasons.push("고른 조건에서 가장 점수가 높아요");
      if (best.who) reasons.push(`${best.who}에게 잘 맞아요`);
      el.innerHTML = `${top}
      <article class="card px found">
        <div class="stage pop" style="--tc:${TYPE_COLORS[best.cat][0]}"><span class="dexno">No.${dexNo(best)}</span>${sprite(best, 140)}</div>
        <p class="hello">찾았다!</p>
        <h1>${esc(best.name)}</h1><p>${esc(best.desc)}</p>
        <div class="talk px" style="text-align:left"><h3>추천하는 이유</h3><ul>${reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
        <div class="found-btns">
          <button class="act go" id="qGo">${esc(best.name)} 자세히 보기</button>
          <div class="two"><button class="act plain" id="qShare">결과 공유</button><button class="act plain" id="qAgain">다시 하기</button></div>
        </div>
      </article>
      ${list.length > 1 ? `<div class="board px subboard"><h2>이것도 잘 맞아요</h2><ul class="list">${list.slice(1, 3).map(r => entry(r.t, total(r.t), null, false)).join("")}</ul></div>` : ""}`;
      $("qGo").onclick = () => { inApp = true; location.hash = "#/ai/" + best.id; };
      $("qAgain").onclick = () => { qStep = 0; qAns = []; renderQuiz(); window.scrollTo(0, 0); };
      $("qShare").onclick = () => shareLink(location.href.split("#")[0] + "#/quiz", "AI 추천 퀴즈", `AI 추천 퀴즈 결과, 나에게 딱 맞는 AI는 ${best.name}! 너도 해봐`);
      el.querySelectorAll(".entry").forEach(b => b.onclick = () => { inApp = true; location.hash = "#/ai/" + b.dataset.id; });
    }
  }
  $("qBack").onclick = () => { location.hash = "#/"; };
}
$("openQuiz").onclick = () => { qStep = 0; qAns = []; location.hash = "#/quiz"; };

/* 공유: 휴대폰은 공유 창, 안 되면 링크 복사 */
async function shareLink(url, title, text){
  if (navigator.share){
    try { await navigator.share({title, text, url}); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요"); return; } catch {}
  try {
    const ta = document.createElement("textarea"); ta.value = url; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove();
    toast(ok ? "링크를 복사했어요" : "주소창의 링크를 복사해 주세요");
  } catch { toast("주소창의 링크를 복사해 주세요"); }
}

/* 기준 창 */
function renderW(){
  $("wrows").innerHTML = CRITERIA.map(c => `
    <div class="wrow"><span>${esc(c.label)}</span>
      <button class="step" data-k="${c.key}" data-d="-1" aria-label="${esc(c.label)} 낮추기" ${weights[c.key] <= 0 ? "disabled" : ""}>-</button>
      <output>x${weights[c.key]}</output>
      <button class="step" data-k="${c.key}" data-d="1" aria-label="${esc(c.label)} 높이기" ${weights[c.key] >= 3 ? "disabled" : ""}>+</button></div>`).join("");
  $("wrows").querySelectorAll(".step").forEach(b => b.onclick = () => {
    const k = b.dataset.k; weights[k] = Math.min(3, Math.max(0, weights[k] + +b.dataset.d));
    store.set("weights", weights); renderW(); renderList();
    const again = $("wrows").querySelector(`.step[data-k="${k}"][data-d="${b.dataset.d}"]`);
    if (again && !again.disabled) again.focus();
  });
}
function modal(open){
  $("modal").classList.toggle("open", open); $("mbg").classList.toggle("open", open);
  if (open) $("modal").querySelector("button").focus(); else $("openW").focus();
}
$("openW").onclick = () => { renderW(); modal(true); };
$("closeW").onclick = $("mbg").onclick = () => modal(false);
$("resetW").onclick = () => { CRITERIA.forEach(c => weights[c.key] = DEFAULT_W); store.set("weights", weights); renderW(); renderList(); toast("기본 기준으로 돌아왔어요"); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").classList.contains("open")) modal(false); });

$("q").oninput = () => { query = $("q").value; renderTypes(); renderList(); };

function route(){
  const m = location.hash.match(/^#\/ai\/(.+)$/);
  const t = m && TOOLS.find(x => x.id === decodeURIComponent(m[1]));
  const dex = !t && location.hash === "#/dex", quiz = !t && location.hash === "#/quiz";
  $("home").hidden = !!t || dex || quiz; $("detail").hidden = !t; $("dex").hidden = !dex; $("quiz").hidden = !quiz;
  if (t){ renderDetail(t); document.title = `${t.name} | AI 도감`; window.scrollTo(0, 0); }
  else if (dex){ renderDex(); document.title = "내 도감 | AI 도감"; window.scrollTo(0, 0); }
  else if (quiz){ renderQuiz(); document.title = "AI 추천 퀴즈 | AI 도감"; window.scrollTo(0, 0); }
  else { document.title = "AI 도감"; renderTypes(); renderList(); }
}
window.addEventListener("hashchange", route);
renderMeter(); renderTypes(); route();
</script>
