<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 랭킹 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --sub:#6B7684; --faint:#B0B8C1;
  --line:#EEF0F3; --blue:#3182F6; --blue-soft:#E8F3FF; --press:#F4F6F8; --star:#FFC342;
  --bar-bg:rgba(242,244,246,.86);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101013; --card:#1E1E24; --ink:#F2F4F6; --sub:#9EA6B2; --faint:#5C6370;
    --line:#2A2A31; --blue:#4D94FF; --blue-soft:#1F2D45; --press:#25252C; --bar-bg:rgba(16,16,19,.86);
  }
}
:root[data-theme="dark"]{
  --bg:#101013; --card:#1E1E24; --ink:#F2F4F6; --sub:#9EA6B2; --faint:#5C6370;
  --line:#2A2A31; --blue:#4D94FF; --blue-soft:#1F2D45; --press:#25252C; --bar-bg:rgba(16,16,19,.86);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 56px}

/* 상단 바 */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bar-bg);
  backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
}
.topbar .in{max-width:640px; margin:0 auto; height:56px; padding:0 16px; display:flex; align-items:center; gap:10px}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.05rem; letter-spacing:-0.03em; text-decoration:none; color:var(--ink)}
.logo i{width:28px; height:28px; border-radius:9px; background:var(--blue); display:grid; place-items:center; color:#fff; font-style:normal; font-size:.9rem}
.back{border:0; background:transparent; width:40px; height:40px; margin-left:-10px; border-radius:12px; cursor:pointer; display:grid; place-items:center}
.back:active{background:var(--press)}
.topbar .ttl{font-weight:700; opacity:0; transition:opacity .2s}
.topbar .ttl.show{opacity:1}

/* 홈 */
.hero{padding:18px 6px 6px}
.hero h1{font-size:1.75rem; line-height:1.3; font-weight:800; margin:0 0 6px; letter-spacing:-0.035em}
.hero p{margin:0; color:var(--sub)}
.search{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px; padding:0 16px; margin-top:20px}
.search svg{flex:none; color:var(--faint)}
.search input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:1rem; padding:14px 0}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{box-shadow:0 0 0 2px var(--blue)}
.clear{border:0; background:var(--faint); color:var(--card); width:20px; height:20px; border-radius:50%; font-size:.7rem; cursor:pointer; display:none}
.search.has-text .clear{display:block}
.cats{display:flex; gap:8px; overflow-x:auto; padding:12px 2px 14px; scrollbar-width:none; transition:opacity .2s}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none; border:0; background:var(--card); color:var(--sub); border-radius:999px; padding:9px 16px; font-weight:600; font-size:.95rem; cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink); color:var(--card)}

.panel{background:var(--card); border-radius:22px; margin-bottom:12px}

/* 1위 카드 */
.champ{display:block; width:100%; border:0; text-align:left; cursor:pointer; padding:22px 20px 20px; background:var(--blue); color:#fff; border-radius:22px; margin-bottom:12px; position:relative; overflow:hidden}
.champ:active{filter:brightness(.95)}
.champ .tag{font-size:.85rem; font-weight:700; opacity:.85}
.champ .row{display:flex; align-items:center; gap:14px; margin-top:12px}
.champ .icon{width:56px; height:56px; border-radius:18px; font-size:1.5rem; background:#fff !important}
.champ .nm{font-size:1.35rem; font-weight:800; letter-spacing:-0.03em}
.champ .ds{opacity:.85; font-size:.92rem}
.champ .big{margin-left:auto; text-align:right}
.champ .big b{font-size:2rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.champ .big small{display:block; opacity:.75; font-size:.8rem; margin-top:4px}
.champ::after{content:"1"; position:absolute; right:-6px; top:-34px; font-size:9rem; font-weight:800; opacity:.08; line-height:1}

.list-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 4px}
.list-head h2{font-size:1.05rem; font-weight:700; margin:0}
.ghost{border:0; background:var(--blue-soft); color:var(--blue); font-weight:600; font-size:.85rem; padding:7px 12px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.tip{display:flex; align-items:center; gap:10px; width:calc(100% - 40px); margin:8px 20px 6px; padding:12px 14px; border:0; border-radius:14px; background:var(--bg); color:var(--sub); font-size:.88rem; text-align:left; cursor:pointer}
.tip:active{background:var(--press)}
.tip span:nth-child(2){flex:1}
.tip::after{content:""; width:7px; height:7px; border-top:2px solid var(--faint); border-right:2px solid var(--faint); transform:rotate(45deg); flex:none}
ol.list{list-style:none; margin:0; padding:0 0 8px}
.row-btn{
  all:unset; box-sizing:border-box; width:100%; cursor:pointer;
  display:grid; grid-template-columns:1.4rem 2.75rem 1fr auto 1rem; gap:12px; align-items:center; padding:12px 20px;
}
.row-btn:active{background:var(--press)}
.row-btn:focus-visible{outline:3px solid var(--blue); outline-offset:-3px; border-radius:12px}
.rank{font-weight:800; font-size:1rem; text-align:center; color:var(--sub)}
.icon{width:2.75rem; height:2.75rem; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:1.1rem}
.name{font-weight:700; font-size:1.02rem}
.desc{font-size:.88rem; color:var(--sub); display:block}
.catname{color:var(--blue); font-weight:600}
.score{text-align:right; line-height:1.25}
.score b{font-size:1.1rem; font-weight:800; font-variant-numeric:tabular-nums}
.chev{color:var(--faint)}
.stars{position:relative; display:inline-block; font-size:.8rem; letter-spacing:1px; color:var(--line)}
.stars i{position:absolute; inset:0 auto 0 0; overflow:hidden; white-space:nowrap; color:var(--star); font-style:normal}
.empty{padding:32px 20px; text-align:center; color:var(--sub)}
footer{margin-top:24px; text-align:center; font-size:.82rem; color:var(--faint)}

/* 기준 바텀시트 */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; display:none}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--card); border-radius:24px 24px 0 0;
  max-width:640px; margin:0 auto; padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%); visibility:hidden;
}
.sheet.open{transform:none; visibility:visible}
.sheet-bg.open{display:block}
.grip{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 16px}
.sheet h3{margin:0 0 4px; font-size:1.2rem; font-weight:800}
.sheet p{margin:0 0 18px; color:var(--sub); font-size:.9rem}
.wrow{display:grid; grid-template-columns:7em 1fr 2.2em; align-items:center; gap:12px; margin:0 0 16px}
.wrow input{width:100%; accent-color:var(--blue)}
.wrow output{text-align:right; color:var(--blue); font-weight:700; font-variant-numeric:tabular-nums}
.cta{display:block; width:100%; border:0; border-radius:16px; background:var(--blue); color:#fff; font-weight:700; font-size:1.02rem; padding:16px; text-align:center; text-decoration:none; cursor:pointer}
.cta:active{filter:brightness(.93)}

/* 상세 */
.d-hero{padding:20px 6px 18px; display:flex; gap:16px; align-items:center}
.d-hero .icon{width:68px; height:68px; border-radius:22px; font-size:1.8rem; flex:none}
.d-hero .cat-l{color:var(--blue); font-weight:700; font-size:.88rem}
.d-hero h1{margin:0; font-size:1.7rem; font-weight:800; letter-spacing:-0.035em; line-height:1.25}
.d-hero p{margin:2px 0 0; color:var(--sub)}
.sec{padding:22px 20px}
.sec h2{font-size:1.05rem; font-weight:700; margin:0 0 14px}
.scorebox{display:flex; align-items:flex-end; gap:12px; margin-bottom:18px}
.scorebox b{font-size:2.6rem; font-weight:800; line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums}
.scorebox .of{color:var(--sub); padding-bottom:4px}
.scorebox .stars{font-size:1.1rem; margin-bottom:6px}
.scorebox .pos{margin-left:auto; background:var(--blue-soft); color:var(--blue); font-weight:700; font-size:.85rem; padding:6px 10px; border-radius:10px; margin-bottom:4px}
.bar{display:grid; grid-template-columns:7em 1fr 2em; gap:12px; align-items:center; font-size:.92rem; margin:10px 0; color:var(--sub)}
.bar span:last-child{text-align:right; color:var(--ink); font-weight:700}
.track{height:8px; background:var(--blue-soft); border-radius:4px; overflow:hidden}
.fill{height:100%; background:var(--blue); border-radius:4px}
.pc{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pc ul{list-style:none; margin:0; padding:0}
.pc li{position:relative; padding-left:26px; margin:0 0 10px; font-size:.95rem}
.pc li::before{position:absolute; left:0; top:1px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:.7rem; font-weight:800}
.pros li::before{content:"✓"; background:var(--blue-soft); color:var(--blue)}
.cons li::before{content:"!"; background:var(--press); color:var(--sub)}
.pc h3{font-size:.9rem; color:var(--sub); font-weight:600; margin:0 0 10px}
.who{margin:0; padding:14px 16px; background:var(--bg); border-radius:14px}
.review{white-space:pre-line; margin:0; line-height:1.75}
.review.none{color:var(--faint)}
.meta{margin-top:14px; font-size:.82rem; color:var(--faint)}
.dock{position:fixed; left:0; right:0; bottom:0; z-index:9; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent,var(--bg) 30%)}
.dock .cta{max-width:608px; margin:0 auto}
#detail{padding-bottom:90px}
@media (max-width:420px){
  .row-btn{grid-template-columns:1.1rem 2.5rem 1fr auto .8rem; gap:10px; padding:12px 16px}
  .icon{width:2.5rem; height:2.5rem}
  .pc{grid-template-columns:1fr}
  .wrow,.bar{grid-template-columns:6em 1fr 2em}
  .hero h1{font-size:1.55rem}
}
@media (prefers-reduced-motion:no-preference){
  .fill{transition:width .4s ease}
  .sheet{transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility .28s}
  .view{animation:in .22s ease}
  @keyframes in{from{opacity:0; transform:translateY(6px)}}
}
.acts{display:flex; gap:8px; padding:0 6px 16px}
.act{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:0; background:var(--card); border-radius:14px; padding:12px; font-weight:600; font-size:.95rem; cursor:pointer}
.act:active{background:var(--press)}
.act svg{flex:none}
.act.on{color:#F04452}
.act.on svg path{fill:#F04452}
.cat.fav{display:inline-flex; align-items:center; gap:4px}
.cat.fav[aria-pressed="true"]{background:#F04452; color:#fff}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,10px); z-index:40;
  background:rgba(25,31,40,.92); color:#fff; padding:12px 18px; border-radius:14px; font-size:.92rem; font-weight:500;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}
.mini-heart{color:#F04452; font-size:.8rem; margin-left:4px}
/* 퀴즈 */
.quiz-entry{display:flex; align-items:center; gap:14px; width:100%; border:0; text-align:left; cursor:pointer; background:var(--card); border-radius:20px; padding:16px 18px; margin-top:12px}
.quiz-entry:active{background:var(--press)}
.quiz-entry .qe-ic{width:44px; height:44px; border-radius:14px; background:var(--blue-soft); display:grid; place-items:center; font-size:1.4rem; flex:none}
.quiz-entry b{display:block; font-size:1rem}
.quiz-entry small{color:var(--sub); font-size:.86rem}
.quiz-entry .chev{margin-left:auto}
.q-wrap{padding:16px 6px 40px}
.q-prog{height:6px; background:var(--card); border-radius:3px; overflow:hidden; margin-bottom:28px}
.q-prog div{height:100%; background:var(--blue); border-radius:3px; transition:width .3s ease}
.q-step{color:var(--blue); font-weight:700; font-size:.9rem}
.q-title{font-size:1.6rem; font-weight:800; letter-spacing:-0.035em; line-height:1.35; margin:4px 0 24px}
.q-opts{display:grid; gap:10px}
.q-opts.two{grid-template-columns:1fr 1fr}
.q-opt{display:flex; align-items:center; gap:12px; border:0; background:var(--card); border-radius:18px; padding:18px 16px; text-align:left; cursor:pointer; font-weight:600; font-size:1rem}
.q-opt:active{background:var(--blue-soft); color:var(--blue)}
.q-opt .em{font-size:1.4rem}
.q-prev{border:0; background:transparent; color:var(--sub); font-weight:600; margin-top:20px; padding:8px 4px; cursor:pointer}
.res-top{text-align:center; padding:12px 0 22px}
.res-top .lbl{color:var(--sub); font-weight:600}
.res-top .icon{width:84px; height:84px; border-radius:26px; font-size:2.2rem; margin:18px auto 14px}
.res-top h1{margin:0; font-size:2rem; font-weight:800; letter-spacing:-0.04em}
.res-top p{margin:4px 0 0; color:var(--sub)}
.why{list-style:none; margin:0; padding:0}
.why li{position:relative; padding-left:28px; margin:0 0 12px}
.why li::before{content:"✓"; position:absolute; left:0; top:1px; width:20px; height:20px; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:grid; place-items:center; font-size:.72rem; font-weight:800}
.res-btns{display:grid; gap:10px; margin-top:4px}
.sub-btn{display:block; width:100%; border:0; border-radius:16px; background:var(--card); font-weight:700; font-size:1rem; padding:15px; cursor:pointer}
.sub-btn:active{background:var(--press)}
.res-btns .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){ .q-title{font-size:1.4rem} }
[hidden]{display:none !important}
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <button class="back" id="back" aria-label="뒤로 가기" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <a class="logo" id="logo" href="#/"><i>★</i>AI 랭킹 노트</a>
    <span class="ttl" id="ttl" hidden></span>
  </div>
</div>

<main class="wrap">
  <!-- 홈 -->
  <section id="home" class="view">
    <div class="hero">
      <h1>어떤 AI를 써볼까요?</h1>
      <p>직접 써보고 내 기준으로 점수를 매긴 AI 순위예요.</p>
    </div>

    <div class="search" id="searchBox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="AI 이름이나 하고 싶은 일 검색" aria-label="AI 검색" autocomplete="off">
      <button class="clear" id="clear" aria-label="검색어 지우기">✕</button>
    </div>

    <button class="quiz-entry" id="quizEntry">
      <span class="qe-ic" aria-hidden="true">🎯</span>
      <span><b>나에게 맞는 AI 찾기</b><small>질문 4개에 답하면 딱 맞는 AI를 추천해요</small></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <nav class="cats" id="cats" aria-label="카테고리"></nav>

    <div id="champ"></div>

    <section class="panel">
      <div class="list-head">
        <h2 id="listTitle">순위</h2>
        <button class="ghost" id="openSheet" aria-label="채점 기준 바꾸기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>기준 바꾸기</button>
      </div>
      <button class="tip" id="tip"><span class="tip-ic" aria-hidden="true">💡</span><span>나에게 중요한 기준을 고르면 순위가 바뀌어요</span></button>
      <ol class="list" id="list"></ol>
    </section>

    <footer>점수와 후기는 직접 써본 경험을 바탕으로 합니다.</footer>
  </section>

  <!-- 상세 -->
  <section id="detail" class="view" hidden></section>

  <!-- 퀴즈 -->
  <section id="quiz" class="view" hidden></section>
</main>

<div class="dock" id="dock" hidden><a class="cta" id="dockLink" target="_blank" rel="noopener">공식 사이트 가기</a></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <h3 id="sheetTitle">내 채점 기준</h3>
  <p>중요한 기준일수록 높이세요. 0이면 점수에서 빠져요.</p>
  <div id="weights"></div>
  <button class="cta" id="closeSheet">적용하기</button>
</div>

<script>
/* ===== 여기만 고치면 사이트 내용이 바뀝니다 ===== */

// 채점 기준
const CRITERIA = [
  { key: "quality", label: "결과물 품질" },
  { key: "free",    label: "무료로 쓸 만함" },
  { key: "korean",  label: "한국어" },
  { key: "easy",    label: "쉬운 정도" },
];

// 카테고리
const CATEGORIES = [
  { id: "chat",  label: "챗봇" },
  { id: "image", label: "그림" },
  { id: "video", label: "영상" },
  { id: "audio", label: "오디오 편집" },
  { id: "music", label: "음악" },
  { id: "code",  label: "코딩" },
  { id: "slide", label: "발표자료" },
  { id: "study", label: "공부" },
  { id: "trans", label: "번역" },
];

/* AI 목록
   id      : 주소에 쓰이는 영어 이름 (예: 사이트주소/#/ai/chatgpt)
   s       : 점수 1~5 (0.5 단위 가능) — 지금은 전부 예시!
   pros    : 장점, cons: 단점, who: 이런 사람에게 추천
   review  : 직접 써본 후기 (줄바꿈은 \n). 비워두면 "후기 준비 중"으로 보여요
   updated : 마지막으로 확인한 날짜                                          */
const TOOLS = [

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let current = store.get("cat", CATEGORIES[0].id);
const favs = new Set(store.get("favs", []));
if (current !== "fav" && !CATEGORIES.some(c => c.id === current)) current = CATEGORIES[0].id;
const weights = Object.assign(Object.fromEntries(CRITERIA.map(c => [c.key, 2])), store.get("weights", {}));
let query = "";
let cameFromHome = false;

const catLabel = id => (CATEGORIES.find(c => c.id === id) || {}).label || "";
function total(t){
  let sum = 0, w = 0;
  for (const c of CRITERIA){ sum += (t.s[c.key] || 0) * weights[c.key]; w += weights[c.key]; }
  return w ? sum / w : 0;
}
function ranked(cat){ return TOOLS.filter(t => t.cat === cat).map(t => ({...t, total: total(t)})).sort((a,b) => b.total - a.total); }

// 이름으로 아이콘 색 정하기
const HUES = [214, 262, 160, 24, 340, 190, 45, 290];
function iconStyle(name){
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = HUES[h % HUES.length];
  return `background:hsl(${hue} 90% 94%);color:hsl(${hue} 70% 42%)`;
}
const icon = (t, cls="icon") => `<span class="${cls}" style="${iconStyle(t.name)}" aria-hidden="true">${esc(t.name.charAt(0))}</span>`;
const stars = v => `<span class="stars" aria-label="5점 만점에 ${v.toFixed(1)}점">★★★★★<i style="width:${(v/5*100).toFixed(1)}%">★★★★★</i></span>`;

let toastTimer;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

function renderList(){
  const q = query.trim().toLowerCase();
  const searching = q !== "";
  $("cats").style.opacity = searching ? .45 : 1;
  let items;
  if (searching){
    items = TOOLS.filter(t => [t.name, t.desc, catLabel(t.cat), t.who, ...(t.pros||[])].join(" ").toLowerCase().includes(q))
      .map(t => ({...t, total: total(t)})).sort((a,b) => b.total - a.total);
    $("champ").innerHTML = "";
    $("listTitle").textContent = `"${query.trim()}" 검색 결과`;
  } else if (current === "fav"){
    items = TOOLS.filter(t => favs.has(t.id)).map(t => ({...t, total: total(t)})).sort((a,b) => b.total - a.total);
    $("champ").innerHTML = "";
    $("listTitle").textContent = "찜한 AI";

    items = ranked(current);

  $("list").innerHTML = items.length

    : `<li class="empty">${searching ? "찾는 AI가 없어요. 다른 단어로 검색해 보세요." : current === "fav" ? "아직 찜한 AI가 없어요.<br>AI 페이지에서 ♡ 찜하기를 눌러 보세요." : "이 카테고리에 아직 AI가 없어요."}</li>`;

function share(t){ return shareLink(location.href, `${t.name} 후기와 점수`, `${t.name}: ${t.desc} (AI 랭킹 노트)`); }
async function shareLink(url, title, text){
  const data = { title, text, url };
  if (navigator.share){
    try { await navigator.share(data); return; }
    catch(e){ if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove();
    toast(ok ? "링크를 복사했어요" : "주소창의 링크를 복사해 공유해 주세요");
  }
}

/* ---------- AI 추천 퀴즈 ----------
   질문을 바꾸고 싶으면 QUIZ만 고치면 돼요.
   set: 답을 고르면 바뀌는 값 (cat = 카테고리, w = 채점 기준 가중치)   */
const QUIZ = [
  { q:"무엇을 하고 싶어요?", grid:true, opts:[
    { em:"💬", t:"질문하고 대화하기", set:{cat:"chat"} },
    { em:"🎨", t:"그림 만들기", set:{cat:"image"} },
    { em:"🎬", t:"영상 만들기·편집", set:{cat:"video"} },
    { em:"🎙️", t:"녹음·목소리 다루기", set:{cat:"audio"} },
    { em:"🎵", t:"노래 만들기", set:{cat:"music"} },
    { em:"💻", t:"코딩·웹사이트", set:{cat:"code"} },
    { em:"📊", t:"발표자료 만들기", set:{cat:"slide"} },
    { em:"📚", t:"공부하기", set:{cat:"study"} },
    { em:"🌏", t:"번역하기", set:{cat:"trans"} },
  ]},
  { q:"돈은 얼마나 쓸 수 있어요?", opts:[
    { em:"🙅", t:"무료로만 쓸래요", set:{w:{free:3}} },
    { em:"🤏", t:"조금은 괜찮아요", set:{w:{free:1.5}} },
    { em:"💎", t:"상관없어요, 제일 좋은 걸로", set:{w:{free:0, quality:3}} },
  ]},
  { q:"영어로 된 사이트도 괜찮아요?", opts:[
    { em:"🇰🇷", t:"한국어가 편해요", set:{w:{korean:3}} },
    { em:"👌", t:"영어도 괜찮아요", set:{w:{korean:0.5}} },
  ]},
  { q:"AI를 얼마나 써봤어요?", opts:[
    { em:"🐣", t:"거의 처음이에요", set:{w:{easy:3}} },
    { em:"🙂", t:"몇 번 써봤어요", set:{w:{easy:1.5}} },
    { em:"😎", t:"자주 써요", set:{w:{easy:0.5}} },
  ]},
];
const WHY = {
  quality:"결과물 품질이 좋아요",
  free:"무료로도 충분히 쓸 수 있어요",
  korean:"한국어로 쓰기 편해요",
  easy:"처음 써도 어렵지 않아요",
};
let qStep = 0, qAns = [];

function quizResult(){
  let cat = "chat"; const w = { quality:2, free:1, korean:1, easy:1 };
  qAns.forEach(a => { if (a.set.cat) cat = a.set.cat; Object.assign(w, a.set.w || {}); });
  const score = t => { let s = 0, sw = 0; for (const k in w){ s += (t.s[k] || 0) * w[k]; sw += w[k]; } return sw ? s / sw : 0; };
  const list = TOOLS.filter(t => t.cat === cat).map(t => ({...t, fit: score(t)})).sort((a,b) => b.fit - a.fit);
  return { list, w };
}

function renderQuiz(){
  const el = $("quiz");
  if (qStep < QUIZ.length){
    const Q = QUIZ[qStep];
    el.innerHTML = `<div class="q-wrap">
      <div class="q-prog"><div style="width:${qStep / QUIZ.length * 100}%"></div></div>
      <div class="q-step">${qStep + 1} / ${QUIZ.length}</div>
      <h1 class="q-title">${esc(Q.q)}</h1>
      <div class="q-opts ${Q.grid ? "two" : ""}">${Q.opts.map((o, i) =>
        `<button class="q-opt" data-i="${i}"><span class="em" aria-hidden="true">${o.em}</span>${esc(o.t)}</button>`).join("")}</div>
      ${qStep > 0 ? `<button class="q-prev" id="qPrev">← 이전 질문</button>` : ""}
    </div>`;
    el.querySelectorAll(".q-opt").forEach(b => b.onclick = () => {
      qAns[qStep] = Q.opts[+b.dataset.i]; qStep++; renderQuiz(); window.scrollTo(0, 0);
    });
    if ($("qPrev")) $("qPrev").onclick = () => { qStep--; renderQuiz(); };
    const first = el.querySelector(".q-opt"); if (first) first.focus({ preventScroll:true });
    return;
  }
  const { list, w } = quizResult();
  const best = list[0];
  if (!best){ el.innerHTML = `<div class="empty">이 분야에 아직 AI가 없어요.</div>`; return; }
  const reasons = Object.keys(w).filter(k => w[k] >= 1.5 && (best.s[k] || 0) >= 4)
    .sort((a,b) => w[b] - w[a]).map(k => WHY[k]);
  if (!reasons.length) reasons.push("고른 조건에서 가장 점수가 높아요");
  el.innerHTML = `<div class="q-wrap">
    <div class="q-prog"><div style="width:100%"></div></div>
    <div class="res-top">
      <div class="lbl">나에게 딱 맞는 AI는</div>
      ${icon(best)}
      <h1>${esc(best.name)}</h1><p>${esc(best.desc)}</p>
    </div>
    <section class="panel sec"><h2>추천하는 이유</h2>
      <ul class="why">${reasons.map(r => `<li>${esc(r)}</li>`).join("")}${best.who ? `<li>${esc(best.who)}에게 잘 맞아요</li>` : ""}</ul>
    </section>
    ${list.length > 1 ? `<section class="panel"><div class="list-head"><h2>이것도 잘 맞아요</h2></div>
      <ol class="list">${list.slice(1, 3).map(o => row({...o, total: total(o)}, null, false)).join("")}</ol></section>` : ""}
    <div class="res-btns">
      <button class="cta" id="qGo">${esc(best.name)} 자세히 보기</button>
      <div class="two"><button class="sub-btn" id="qShare">결과 공유하기</button><button class="sub-btn" id="qAgain">다시 하기</button></div>
    </div>
  </div>`;
  el.querySelectorAll(".row-btn").forEach(b => b.onclick = () => { cameFromHome = true; location.hash = "#/ai/" + b.dataset.id; });
  $("qGo").onclick = () => { cameFromHome = true; location.hash = "#/ai/" + best.id; };
  $("qAgain").onclick = () => { qStep = 0; qAns = []; renderQuiz(); window.scrollTo(0, 0); };
  $("qShare").onclick = () => shareLink(location.href.split("#")[0] + "#/quiz",
    "AI 추천 퀴즈", `AI 추천 퀴즈 결과, 나에게 딱 맞는 AI는 ${best.name}! 너도 해봐`);
}

/* ---------- 화면 전환 ---------- */
function route(){
  const h = location.hash;
  const m = h.match(/^#\/ai\/([\w-]+)/);
  const t = m && TOOLS.find(x => x.id === m[1]);
  const view = t ? "detail" : h.startsWith("#/quiz") ? "quiz" : "home";
  ["home","detail","quiz"].forEach(id => $(id).hidden = id !== view);
  $("dock").hidden = view !== "detail";
  $("back").hidden = view === "home"; $("logo").hidden = view !== "home";
  $("ttl").hidden = view === "home"; $("ttl").classList.toggle("show", view === "quiz");
  if (view === "detail") renderDetail(t);
  else if (view === "quiz"){ $("ttl").textContent = "AI 추천 퀴즈"; document.title = "나에게 맞는 AI 찾기 · AI 랭킹 노트"; qStep = 0; qAns = []; renderQuiz(); }
  else { document.title = "AI 랭킹 노트"; renderList(); }
  const v = $(view);
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  window.scrollTo(0, 0);
}
$("quizEntry").onclick = () => { cameFromHome = true; location.hash = "#/quiz"; };
$("back").onclick = () => { if (cameFromHome) history.back(); else location.hash = "#/"; };
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => {
  const n = $("dName"); if (!n || $("detail").hidden) return;
  $("ttl").classList.toggle("show", n.getBoundingClientRect().bottom < 60);
}, { passive: true });

$("q").oninput = () => { query = $("q").value; $("searchBox").classList.toggle("has-text", !!query); renderList(); };
$("clear").onclick = () => { $("q").value = ""; $("q").oninput(); $("q").focus(); };

renderCats(); renderWeights(); route();
</script>
</body>
</html>
